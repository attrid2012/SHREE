<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - SHREE</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">


    <aside class="sidebar">

        <div class="sidebar-brand">
            SHREE
        </div>


        <button
            class="new-chat-button"
            onclick="location.href='dashboard.html'"
        >
            + New Chat
        </button>


        <nav class="side-navigation">

            <a href="dashboard.html">
                Ask SHREE
            </a>

            <a href="recent.html">
                Recent Searches
            </a>

            <a href="profile.html" class="active">
                Profile
            </a>

        </nav>


        <button
            class="logout-button"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </aside>



    <main class="main-area">

        <header class="topbar">

            <div>

                <h2>Profile</h2>

                <p>
                    Your SHREE account
                </p>

            </div>

        </header>


        <section class="profile-container">

            <div class="profile-card">

                <div class="profile-avatar">
                    S
                </div>


                <h1 id="profileName">
                    User
                </h1>


                <p id="profileEmail">
                    Email
                </p>


                <div class="profile-line"></div>


                <button
                    class="profile-logout"
                    onclick="logoutUser()"
                >
                    Logout
                </button>

            </div>

        </section>

    </main>

</div>


<script src="auth.js"></script>
<script src="profile.js"></script>

</body>
